<!DOCTYPE html>
<html>
<head>
    <title>AI-Based Cardiac Digital Twin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            color: white;
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            padding:20px;
        }

        .dashboard{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:25px;
            padding:20px;
        }

        .card{
            width:250px;
            background:rgba(255,255,255,0.08);
            padding:25px;
            border-radius:15px;
            text-align:center;
        }

        .value{
            font-size:30px;
            font-weight:bold;
        }

        .normal{ color:#00ff99; }
        .abnormal{ color:#ff4d4d; }

        canvas{
            background:#fff;
            border-radius:10px;
        }
    </style>
</head>

<body>

<div class="topbar">
    <h2>🫀 Cardiac Digital Twin Dashboard</h2>
    <div>
        <a href="/admin" style="color:cyan">Admin</a>
        <a href="/logout" style="color:cyan;margin-left:15px">Logout</a>
    </div>
</div>

<div class="dashboard">

    <div class="card">
        <h3>Heart Rate</h3>
        <div class="value bpm">{{ bpm }} BPM</div>
    </div>

    <div class="card">
        <h3>Status</h3>
        <div class="value status {% if 'Abnormal' in status %}abnormal{% else %}normal{% endif %}">
            {{ status }}
        </div>
    </div>

    <div class="card">
        <h3>Risk %</h3>
        <div class="value risk">{{ risk }}%</div>
    </div>

    <div class="card">
        <h3>Model Accuracy</h3>
        <div class="value">{{ (accuracy*100)|round(1) }}%</div>
    </div>

    <div class="card">
    <h3>3D Cardiac Twin</h3>

    <a href="/metaverse">
        <button style="
            padding:12px 25px;
            background:#00e5ff;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;">
            Open Metaverse
        </button>
    </a>
</div>

    <div class="card" style="width:600px">
        <h3>Live Heart Rate Graph</h3>
        <canvas id="chart"></canvas>
    </div>

</div>

<script>
const ctx = document.getElementById('chart').getContext('2d');

let dataArr = [{{ bpm }}];

const chart = new Chart(ctx,{
    type:'line',
    data:{
        labels:dataArr.map((_,i)=>i),
        datasets:[{
            label:'Heart Rate (BPM)',
            data:dataArr,
            borderColor:'cyan',
            borderWidth:3,
            fill:false,
            tension:0.4
        }]
    },
    options:{
        responsive:true,
        plugins:{
            legend:{
                labels:{
                    color:"white"
                }
            }
        },
        scales:{
            x:{
                ticks:{color:"white"},
                grid:{color:"rgba(255,255,255,0.1)"}
            },
            y:{
                ticks:{color:"white"},
                grid:{color:"rgba(255,255,255,0.1)"}
            }
        }
    }
});

setInterval(async()=>{

    const res = await fetch('/api/health');
    const d = await res.json();

    document.querySelector('.bpm').innerText = d.bpm + " BPM";
    document.querySelector('.status').innerText = d.status;
    document.querySelector('.risk').innerText = d.risk + "%";

    dataArr.push(d.bpm);

    if(dataArr.length>20)
        dataArr.shift();

    chart.data.labels = dataArr.map((_,i)=>i);
    chart.data.datasets[0].data = dataArr;

    chart.update();

},2000);

</script>
</body>
</html>
